<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFly | Mis Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../img/logo/logo.png" class="logo-navbar" alt="NovaFly">
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="vuelos.html"> Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinos.html"> Destinos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"> Mis Reservas</a></li>
                    <li class="nav-item ms-lg-3">
                        <button id="btnModoOscuro" class="btn btn-outline-light btn-sm" type="button">
                            <i class="bi bi-moon"></i> Modo oscuro</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="py-5 bg-light">
        <div class="container text-center">
            <h1 class="fw-bold"> Mis Reservas</h1>
            <p class="text-muted"> Consulta, edita o elimina tus reservas.</p>
        </div>
    </section>
    <section class="container py-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-primary text-center">
                            <tr>
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Ruta</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Precio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReservas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"> Editar reserva</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditar">
                        <input type="hidden" id="editarId">
                        <div class="mb-3">
                            <label for="editarNombre" class="form-label"> Nombre</label>
                            <input type="text" id="editarNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarApellido" class="form-label"> Apellido</label>
                            <input type="text" id="editarApellido" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarDocumento" class="form-label"> Documento</label>
                            <input type="text" id="editarDocumento" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarTelefono" class="form-label"> Teléfono</label>
                            <input type="tel" id="editarTelefono" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarCorreo" class="form-label"> Correo electrónico</label>
                            <input type="email" id="editarCorreo" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-circle"></i> Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="container text-center">
            <h4> NovaFly</h4>
            <p> Tu próximo destino comienza aquí.</p>
            <small> © 2026 NovaFly Airlines</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/reservas.js"></script>
    <script src="../js/modo-oscuro.js"></script>
</body>
</html>

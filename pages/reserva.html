<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFly | Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../img/logo/logo.png" class="logo-navbar" alt="NovaFly">
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="vuelos.html"> Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinos.html"> Destinos</a></li>
                    <li class="nav-item"><a class="nav-link" href="mis-reservas.html"> Mis Reservas</a></li>
                    <li class="nav-item ms-lg-3">
                        <button id="btnModoOscuro" class="btn btn-outline-light btn-sm" type="button">
                            <i class="bi bi-moon"></i> Modo oscuro</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="py-5 text-center">
        <div class="container">
            <h1 class="fw-bold">Confirmar Reserva</h1>
            <p class="text-muted">Completa tus datos para finalizar la reserva.</p>
        </div>
    </section>
    <section class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card border-0 shadow rounded-4">
                    <div class="card-body">
                        <h4 class="mb-4">Resumen del vuelo</h4>
                        <p>
                            <strong>Ruta:</strong>
                            <span id="rutaVuelo"></span>
                        </p>
                        <p>
                            <strong>Fecha:</strong>
                            <span id="fechaVuelo"></span>
                        </p>
                        <p>
                            <strong>Hora:</strong>
                            <span id="horaVuelo"></span>
                        </p>
                        <hr>
                        <h3 class="text-primary" id="precioVuelo">
                        </h3>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card border-0 shadow rounded-4">
                    <div class="card-body p-4">
                        <div id="mensaje"></div>
                        <h4 class="mb-4">Datos del pasajero</h4>
                        <form id="formReserva">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input id="nombre" type="text" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellidos</label>
                                    <input id="apellido" type="text" class="form-control" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Documento</label>
                                    <input id="documento" type="number" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono</label>
                                    <input id="telefono" type="tel" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input id="correo" type="email" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-3">Confirmar Reserva</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="container text-center">
            <h4>NovaFly</h4>
            <p>Tu próximo destino comienza aquí.</p>
            <small>© 2026 NovaFly Airlines</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/reserva.js"></script>
    <script src="../js/modo-oscuro.js"></script>
</body>
</html>

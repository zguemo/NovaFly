<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaFly | Vuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    </head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../img/logo/logo.png" class="logo-navbar" alt="NovaFly">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"> Vuelos</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinos.html">  Destinos</a></li>
                    <li class="nav-item"><a class="nav-link" href="mis-reservas.html"> Mis Reservas</a></li>
                    <li class="nav-item ms-lg-3">
                        <button  id="btnModoOscuro" class="btn btn-outline-light btn-sm"type="button">
                            <i class="bi bi-moon"></i> Modo oscuro
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="py-5 text-center">
        <div class="container">
            <h1 class="fw-bold">  Buscar vuelos</h1>
            <p class="text-muted"> Encuentra el mejor destino para tu próximo viaje.</p>
        </div>
    </section>
    <section class="container mb-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <form id="formBusqueda" class="row g-3">
                    <div class="col-lg-3">
                        <label for="origen"class="form-label">Origen</label>
                        <input type="text" id="origen" class="form-control" placeholder="Bogotá" required>
                    </div>
                    <div class="col-lg-3">
                        <label for="destino" class="form-label"> Destino</label>
                        <input type="text"id="destino"class="form-control"placeholder="Cartagena" required>
                    </div>
                    <div class="col-lg-2">
                        <label  for="fecha" class="form-label"> Ida</label>
                        <input type="date" id="fecha" class="form-control" required>
                    </div>
                    <div class="col-lg-2">
                        <label for="pasajeros" class="form-label"> Pasajeros</label>
                        <input type="number"id="pasajeros"value="1"min="1"class="form-control" required>
                    </div>
                    <div class="col-lg-2 d-grid">
                        <label class="form-label text-white">  Buscar</label>
                        <button type="submit" class="btn btn-primary"> <i class="bi bi-search"></i> Buscar</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <section class="container mb-5">
        <h3 class="mb-4"> Resultados disponibles</h3>
        <div  id="resultadosVuelos" class="row g-4">
        </div>
    </section>
    <footer>
        <div class="container text-center">
            <h4> NovaFly</h4>
            <p>  Tu próximo destino comienza aquí.</p>
            <small>  © 2026 NovaFly Airlines</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/vuelos.js"> </script>
    <script src="../js/modo-oscuro.js"></script>
</body>
</html>
